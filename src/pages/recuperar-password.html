<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar contraseña | HADES</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="../assets/css/app.css" rel="stylesheet">
    <style>
        body { font-family: Manrope, sans-serif; }
    </style>
</head>
<body class="min-h-screen bg-[#050a17] text-white">
    <main class="flex min-h-screen items-center justify-center p-5">
        <section class="w-full max-w-lg rounded-3xl border border-blue-900/50 bg-[#0e1e3e] p-7 shadow-2xl sm:p-10">
            <a href="bienvenida.html" class="mb-8 inline-flex items-center gap-2 text-sm font-bold text-blue-300 hover:text-white">
                <span aria-hidden="true">←</span> Volver a HADES
            </a>
            <img src="../assets/img/logo_final.png" alt="" class="mb-5 h-14 w-14 object-contain">
            <h1 id="titulo" class="text-2xl font-extrabold sm:text-3xl">Recuperar contraseña</h1>
            <p id="descripcion" class="mt-3 text-sm leading-6 text-slate-300">
                Ingresá el correo de tu cuenta. Te enviaremos un enlace para verificar tu respuesta y cambiar la contraseña.
            </p>

            <form id="solicitudForm" class="mt-7 space-y-4">
                <label for="correo" class="block text-sm font-bold">Correo electrónico</label>
                <input id="correo" name="correo" type="email" maxlength="254" autocomplete="email" required
                    class="w-full rounded-xl border border-blue-800 bg-[#07152e] px-4 py-3 text-white placeholder:text-slate-500 focus:border-emerald-300 focus:ring-emerald-300"
                    placeholder="nombre@ejemplo.com">
                <button type="submit" class="w-full rounded-xl bg-blue-700 px-5 py-3 font-bold text-white transition hover:bg-blue-600">
                    Enviar enlace
                </button>
            </form>

            <form id="verificacionForm" class="mt-7 hidden space-y-4" hidden>
                <label for="respuestaRecuperacion" class="block text-sm font-bold">
                    Personaje favorito o nombre de tu primera mascota
                </label>
                <input id="respuestaRecuperacion" name="respuestaRecuperacion" type="text" maxlength="72" autocomplete="off" required
                    class="w-full rounded-xl border border-blue-800 bg-[#07152e] px-4 py-3 text-white placeholder:text-slate-500 focus:border-emerald-300 focus:ring-emerald-300"
                    placeholder="Tu respuesta secreta">
                <button type="submit" class="w-full rounded-xl bg-blue-700 px-5 py-3 font-bold text-white transition hover:bg-blue-600">
                    Verificar respuesta
                </button>
            </form>

            <form id="cambioForm" class="mt-7 hidden space-y-4" hidden>
                <label for="passwordNueva" class="block text-sm font-bold">Nueva contraseña</label>
                <input id="passwordNueva" name="passwordNueva" type="password" minlength="12" maxlength="72" autocomplete="new-password" required
                    class="w-full rounded-xl border border-blue-800 bg-[#07152e] px-4 py-3 text-white focus:border-emerald-300 focus:ring-emerald-300">
                <label for="passwordConfirmacion" class="block text-sm font-bold">Repetir nueva contraseña</label>
                <input id="passwordConfirmacion" name="passwordConfirmacion" type="password" minlength="12" maxlength="72" autocomplete="new-password" required
                    class="w-full rounded-xl border border-blue-800 bg-[#07152e] px-4 py-3 text-white focus:border-emerald-300 focus:ring-emerald-300">
                <button type="submit" class="w-full rounded-xl bg-blue-700 px-5 py-3 font-bold text-white transition hover:bg-blue-600">
                    Cambiar contraseña
                </button>
            </form>

            <p id="estado" role="status" aria-live="polite" class="mt-5 min-h-6 text-sm text-blue-200"></p>
            <button id="volverLogin" type="button"
                class="mt-3 hidden w-full rounded-xl bg-emerald-700 px-5 py-3 text-center font-bold text-white transition hover:bg-emerald-600">
                Volver al inicio de sesión
            </button>
        </section>
    </main>
    <script src="../assets/js/recuperar-password.js"></script>
</body>
</html>
