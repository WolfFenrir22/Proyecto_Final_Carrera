<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="no-referrer">
    <title>Recuperar contraseña - HADES</title>
    <style>
        :root { color-scheme: dark; font-family: Arial, sans-serif; background: #101827; color: #f8fafc; }
        body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; }
        main { width: min(100%, 440px); padding: 32px; border: 1px solid #334155; border-radius: 16px; background: #172338; box-sizing: border-box; }
        h1 { margin-top: 0; }
        p { color: #cbd5e1; line-height: 1.5; }
        label { display: block; margin: 18px 0 8px; font-weight: 700; }
        input, button { width: 100%; box-sizing: border-box; padding: 13px 14px; border-radius: 9px; font: inherit; }
        input { border: 1px solid #64748b; background: #0f172a; color: #fff; }
        button { margin-top: 22px; border: 0; background: #1e40af; color: #fff; font-weight: 700; cursor: pointer; }
        button:disabled { opacity: .6; cursor: wait; }
        [role="status"] { min-height: 24px; margin-top: 16px; color: #bfdbfe; }
        a { color: #93c5fd; }
    </style>
</head>
<body>
<main>
    <h1 id="titulo">Recuperar contraseña</h1>
    <p id="descripcion">    Ingresá el correo de tu cuenta. Te enviaremos un enlace para verificar tu respuesta y cambiar la contraseña.</p>

    <form id="solicitudForm">
        <label for="correo">Correo electrónico</label>
        <input id="correo" name="correo" type="email" maxlength="254" autocomplete="email" required>
        <button type="submit">Enviar enlace</button>
    </form>

    <form id="verificacionForm" class="mt-7 hidden space-y-4" hidden>
        <label for="respuestaRecuperacion" class="block text-sm font-bold">
            Personaje favorito o nombre de tu primera mascota
        </label>
        <input id="respuestaRecuperacion" name="respuestaRecuperacion" type="text" maxlength="72" autocomplete="off" required
            class="w-full rounded-xl border border-blue-800 bg-[#07152e] px-4 py-3 text-white placeholder:text-slate-500 focus:border-emerald-300 focus:ring-emerald-300"
            placeholder="Tu respuesta secreta">
        <button type="submit" class="w-full rounded-xl bg-blue-700 px-5 py-3 font-bold text-white transition hover:bg-blue-600">
            Verificar respuesta
        </button>
    </form>

    <form id="cambioForm" hidden>
        <label for="passwordNueva">Nueva contraseña</label>
        <input id="passwordNueva" name="passwordNueva" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
        <label for="passwordConfirmacion">Repetir nueva contraseña</label>
        <input id="passwordConfirmacion" name="passwordConfirmacion" type="password" minlength="12" maxlength="72" autocomplete="new-password" required>
        <button type="submit">Cambiar contraseña</button>
    </form>

    <p id="estado" role="status" aria-live="polite"></p>
    <p><a href="./">Volver a HADES</a></p>
</main>
<script src="./recuperar-password.js"></script>
</body>
</html>
